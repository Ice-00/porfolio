<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXO- Personal Portfoilio Template</title>
    <link rel="stylesheet" href="exo.css">
</head>
<body>
   <div id="wrapper">
    <header id="header">
        <div class="logo-container">
            <!-- logo of the page -->
            <div class="logo">
                <a href="#">exo</a>
            </div>
        </div>
        <!-- Nav of Page -->
        <nav id="nav">
            <ul>
                <li><a href="#Welcome" class="active">Welcome</a></li>
                <li><a href="#works">works</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#services">services</a></li>
                <li><a href="#skills">skills</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- main sec of the page -->
    <main id="main">
        <!-- Banner section -->
        <section id="Welcome" class="banner-sec ">
            <!-- Left Text Caption -->
            <div class="caption">
                <h1 class="text-uppercase" data-heading="MARTIN JONES">
                    THINKING <br>
                    <span class="orange">BETTER</span> TO <br>
                    MAKE THE <br>
                    <span class="orange">CHANGES.</span>
                </h1>
                <p>I am Martin Jones. Professional Wedding & Product Photographer.</p>
            </div>
            <!-- Right Banner Image -->
            <div class="banner-img">
                <img src="images/img08.png" alt="banner image">
            </div>
        </section>

        <section id="works" class="work-sec">
            <div class="works-content">
                <h2 class="text-uppercase section-title" data-heading="WORKS">
                    AWESOME WORKS DONE BY ME
                </h2>
                <div class="orange-line"></div>
                
                <!-- Image Grid -->
                <div class="works-grid">
                    <figure class="work-item item-large">
                        <img src="images/img02.jpg" alt="Tall bottle shot">
                    </figure>
                    <figure class="work-item item-bike">
                        <img src="images/img03.jpg" alt="Bicycle">
                    </figure>
                    <figure class="work-item item-brush">
                        <img src="images/img04.jpg" alt="Brushes">
                    </figure>
            
                    <figure class="work-item item-dark">
                        <img src="images/img06.jpg" alt="Dark product shot">
                    </figure>
                    <figure class="work-item item-bag">
                        <img src="images/img05.jpg" alt="bag">
                    </figure>
                
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
